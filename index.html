<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hestia Image Oracle</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #120d18;
  color: #f5edf8;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 700px;
  text-align: center;
}

h1 {
  font-size: 28px;
  font-weight: normal;
  margin-bottom: 25px;
}

.image-box {
  width: 100%;
  min-height: 55vh;
  background: #21152b;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-box img {
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
}

.placeholder {
  color: #bca9c6;
  font-size: 18px;
  padding: 40px;
}

button {
  margin-top: 20px;
  padding: 14px 28px;
  border: 1px solid #80618c;
  border-radius: 30px;
  background: #382442;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<div class="container">

<h1>HESTIA · IMAGE ORACLE</h1>

<div class="image-box" id="imageBox">
  <div class="placeholder">
    Your image will appear here.
  </div>
</div>

<button onclick="drawImage()">
  DRAW AN IMAGE
</button>

</div>

<script>

const images = [

"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Family_portrait.jpg/800px-Family_portrait.jpg",

"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/People_talking.jpg/800px-People_talking.jpg",

"https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Children_playing.jpg/800px-Children_playing.jpg",

"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Street_scene.jpg/800px-Street_scene.jpg",

"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/People_in_a_market.jpg/800px-People_in_a_market.jpg"

];

function drawImage() {

  const randomIndex =
    Math.floor(Math.random() * images.length);

  const image =
    document.createElement("img");

  image.src =
    images[randomIndex];

  image.alt =
    "Random everyday life image";

  const box =
    document.getElementById("imageBox");

  box.innerHTML = "";

  box.appendChild(image);

}

</script>

</body>
</html>
