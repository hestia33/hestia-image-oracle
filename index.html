<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hestia Image Oracle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5efe7;
      color: #3d3028;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #806e61;
      margin-bottom: 30px;
    }

    .image-box {
      width: 100%;
      min-height: 400px;
      background: #e9dfd4;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .image-box img {
      display: block;
      width: 100%;
      max-height: 650px;
      object-fit: contain;
    }

    .placeholder {
      color: #8b796b;
      padding: 30px;
      line-height: 1.8;
    }

    button {
      border: none;
      background: #6f5748;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .counter {
      margin-top: 18px;
      font-size: 13px;
      color: #98877b;
    }

    .loading {
      color: #806e61;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hestia</h1>

    <div class="subtitle">
      Image Oracle
    </div>

    <div class="image-box" id="imageBox">
      <div class="placeholder loading">
        در حال آماده‌سازی تصاویر...
      </div>
    </div>

    <button id="drawButton" disabled>
      دریافت تصویر
    </button>

    <div class="counter" id="counter"></div>

  </div>


  <script>

    const owner = "hestia33";
    const repository = "hestia-image-oracle";
    const folder = "images";

    let images = [];
    let recentImages = [];

    const imageBox = document.getElementById("imageBox");
    const drawButton = document.getElementById("drawButton");
    const counter = document.getElementById("counter");


    /*
      پیدا کردن خودکار تمام تصاویر داخل پوشه images
    */

    async function loadImages() {

      try {

        const apiUrl =
          `https://api.github.com/repos/${owner}/${repository}/contents/${folder}`;

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error("Could not load image folder");
        }

        const files = await response.json();

        images = files
          .filter(file => {
            return file.type === "file" &&
              /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name);
          })
          .map(file => file.download_url);

        if (images.length === 0) {

          imageBox.innerHTML = `
            <div class="placeholder">
              هنوز تصویری در بانک تصاویر پیدا نشد.
            </div>
          `;

          counter.textContent = "";

          return;
        }

        counter.textContent =
          `${images.length} تصویر در بانک تصاویر`;

        drawButton.disabled = false;

        drawImage();

      } catch (error) {

        console.error(error);

        imageBox.innerHTML = `
          <div class="placeholder">
            در بارگذاری تصاویر مشکلی پیش آمد.
            <br>
            لطفاً چند لحظه بعد دوباره امتحان کن.
          </div>
        `;

        counter.textContent = "";

      }

    }


    /*
      انتخاب تصادفی تصویر
    */

    function drawImage() {

      if (images.length === 0) return;

      let availableImages = images.filter(
        image => !recentImages.includes(image)
      );

      /*
        اگر همه تصاویر اخیراً دیده شده باشند،
        دوباره از کل بانک استفاده می‌کنیم.
      */

      if (availableImages.length === 0) {

        recentImages = [];

        availableImages = [...images];

      }


      const randomIndex =
        Math.floor(Math.random() * availableImages.length);

      const selectedImage =
        availableImages[randomIndex];


      /*
        ذخیره تصویر در لیست تصاویر اخیر
      */

      recentImages.push(selectedImage);


      /*
        فقط 10 تصویر اخیر را به خاطر می‌سپاریم
      */

      if (recentImages.length > 10) {
        recentImages.shift();
      }


      /*
        نمایش تصویر
      */

      imageBox.innerHTML = "";

      const img = document.createElement("img");

      img.src = selectedImage;

      img.alt = "Hestia Image Oracle";

      imageBox.appendChild(img);

    }


    drawButton.addEventListener("click", drawImage);


    /*
      شروع برنامه
    */

    loadImages();

  </script>

</body>
</html>
