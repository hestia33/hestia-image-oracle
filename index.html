<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hestia Image Oracle</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #120d18;
  color: #f5edf8;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 92%;
  max-width: 720px;
  text-align: center;
}

.moon {
  font-size: 28px;
  margin-bottom: 8px;
}

.brand {
  font-size: 13px;
  letter-spacing: 0.25em;
  color: #bca9c6;
}

h1 {
  font-size: 28px;
  font-weight: normal;
  margin: 8px 0 24px;
}

.image-box {
  width: 100%;
  min-height: 55vh;
  background: #21152b;
  border: 1px solid #46344f;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-box img {
  display: block;
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
}

.placeholder {
  color: #bca9c6;
  font-size: 18px;
  line-height: 1.7;
  padding: 40px;
}

button {
  margin-top: 20px;
  padding: 14px 28px;
  border: 1px solid #80618c;
  border-radius: 30px;
  background: #382442;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.6;
}

.status {
  margin-top: 12px;
  min-height: 20px;
  color: #bca9c6;
  font-family: system-ui, sans-serif;
  font-size: 12px;
}

.source {
  margin-top: 8px;
  font-family: system-ui, sans-serif;
  font-size: 11px;
  color: #8f7c98;
}

.source a {
  color: #cdb1d8;
}
</style>
</head>

<body>

<div class="container">

  <div class="moon">☾</div>

  <div class="brand">
    HESTIA
  </div>

  <h1>
    Image Oracle
  </h1>

  <div class="image-box" id="imageBox">

    <div class="placeholder">
      Your image will appear here.<br>
      Draw when you are ready.
    </div>

  </div>

  <button id="drawButton" onclick="drawImage()">
    DRAW AN IMAGE
  </button>

  <div class="status" id="status"></div>

  <div class="source" id="source"></div>

</div>


<script>

const API =
  "https://commons.wikimedia.org/w/api.php";


const searches = [

  "people daily life",
  "people conversation",
  "people together",
  "family",
  "family life",
  "friends together",
  "couple",
  "people portrait",
  "woman portrait",
  "man portrait",
  "people meeting",
  "people walking",
  "people sitting",
  "people talking",
  "people at home",
  "people in street",
  "people in market",
  "people celebrating",
  "people reading",
  "people working",
  "children playing",
  "mother child",
  "father child",
  "old people",
  "young people",
  "people in nature",
  "human relationship",
  "human connection",
  "everyday life photograph",
  "vintage people photograph",
  "historical people"

];


let lastImage = "";


function randomItem(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


async function searchCommons(searchText) {

  const params = new URLSearchParams({

    action: "query",

    format: "json",

    origin: "*",

    generator: "search",

    gsrsearch: searchText,

    gsrnamespace: "6",

    gsrlimit: "50",

    prop: "imageinfo",

    iiprop: "url|mime",

    iiurlwidth: "1000"

  });


  const response =
    await fetch(
      API + "?" + params.toString()
    );


  if (!response.ok) {

    throw new Error(
      "Commons API error " +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.query ||
      !data.query.pages) {

    return [];

  }


  const pages =
    Object.values(
      data.query.pages
    );


  return pages.filter(page => {

    if (!page.imageinfo ||
        !page.imageinfo[0]) {

      return false;

    }


    const info =
      page.imageinfo[0];


    if (!info.thumburl) {

      return false;

    }


    if (!info.mime ||
        !info.mime.startsWith("image/")) {

      return false;

    }


    if (
      info.mime === "image/svg+xml"
    ) {

      return false;

    }


    return true;

  });

}


async function drawImage() {

  const button =
    document.getElementById(
      "drawButton"
    );

  const box =
    document.getElementById(
      "imageBox"
    );

  const status =
    document.getElementById(
      "status"
    );

  const source =
    document.getElementById(
      "source"
    );


  button.disabled = true;

  status.textContent =
    "Finding an image…";

  source.innerHTML = "";


  try {

    let candidates = [];


    const shuffled =
      [...searches].sort(
        () => Math.random() - 0.5
      );


    for (
      const searchText
      of shuffled.slice(0, 6)
    ) {

      try {

        const results =
          await searchCommons(
            searchText
          );


        candidates.push(
          ...results
        );

      } catch (error) {

        console.log(
          "Search failed:",
          searchText,
          error
        );

      }

    }


    candidates =
      candidates.filter(
        (item, index, array) => {

          const url =
            item.imageinfo[0].thumburl;

          return (
            array.findIndex(
              other =>
                other.imageinfo[0].thumburl
                === url
            ) === index
          );

        }
      );


    if (!candidates.length) {

      throw new Error(
        "No images found"
      );

    }


    const available =
      candidates.filter(
        item =>
          item.imageinfo[0].thumburl
          !== lastImage
      );


    const pool =
      available.length
        ? available
        : candidates;


    const selected =
      randomItem(pool);


    const info =
      selected.imageinfo[0];


    const image =
      new Image();


    image.alt =
      selected.title
      || "Random human life image";


    image.onload =
      function() {

        box.innerHTML = "";

        box.appendChild(
          image
        );

        status.textContent =
          "Image drawn.";

        source.innerHTML =
          'Source: <a href="' +
          info.descriptionurl +
          '" target="_blank" rel="noopener">' +
          'Wikimedia Commons' +
          '</a>';

        lastImage =
          info.thumburl;

        button.disabled =
          false;

      };


    image.onerror =
      function() {

        status.textContent =
          "This image could not be loaded. Drawing another…";

        button.disabled =
          false;

      };


    image.src =
      info.thumburl;


  } catch (error) {

    console.error(error);

    status.textContent =
      "Could not find an image. Please try again.";

    button.disabled =
      false;

  }

}

</script>

</body>
</html>
