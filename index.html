<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24152f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><title>HESTIA IMAGE ORACLE</title>
<style>
:root{--bg:#120d18;--panel:#21152b;--ink:#f5edf8;--muted:#bca9c6;--accent:#d8b4e5;--line:#46344f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#352040 0,#120d18 48%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}main{width:min(720px,100%);margin:auto;padding:28px 18px 42px;text-align:center}.moon{font-size:28px;margin:6px 0 8px}.brand{letter-spacing:.25em;font-size:13px;color:var(--muted)}h1{font-size:30px;font-weight:400;margin:8px 0 6px}.sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px;line-height:1.6;margin:0 auto 22px;max-width:520px}.card{background:rgba(33,21,43,.82);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.3)}.image-wrap{min-height:54vh;display:flex;align-items:center;justify-content:center;background:#17101d;border-radius:16px;overflow:hidden}.image-wrap img{display:block;width:100%;max-height:68vh;object-fit:contain}.placeholder{padding:55px 24px;color:var(--muted);font-size:18px;line-height:1.7}.actions{display:flex;gap:10px;justify-content:center;margin:16px 0 8px;flex-wrap:wrap}button{border:1px solid #72577e;background:#382442;color:#fff;padding:13px 20px;border-radius:999px;font:600 14px system-ui,sans-serif;letter-spacing:.03em}button:active{transform:scale(.98)}button.secondary{background:transparent;color:var(--muted)}button:disabled{opacity:.55}.meta{font:12px/1.6 system-ui,sans-serif;color:var(--muted);text-align:left;padding:12px 5px 2px}.meta a{color:var(--accent)}.status{min-height:22px;color:var(--muted);font:12px system-ui,sans-serif;margin-top:7px}.tip{margin-top:18px;font:11px/1.6 system-ui,sans-serif;color:#96849f}.credit{margin-top:12px;font:10px system-ui,sans-serif;color:#7f6c88}
</style></head>
<body><main><div class="moon">☾</div><div class="brand">HESTIA</div><h1>Image Oracle</h1>
<section class="card"><div id="imageWrap" class="image-wrap"><div class="placeholder">Your image will appear here.<br><span>Draw when you are ready.</span></div></div>
<div class="actions"><button id="draw">DRAW AN IMAGE</button><button id="again" class="secondary" disabled>DRAW AGAIN</button></div><div id="status" class="status"></div><div id="meta" class="meta"></div></section>
<div class="tip">Source and license information are shown with each image.</div><div class="credit">Made with the Openverse API · Hestia Image Oracle</div></main>
<script>
const API='https://api.openverse.org/v1/images/';
const queries=['people daily life','people conversation','people meeting','people at home','people at work','family daily life','friends together','couple together','woman portrait','man portrait','children playing','people in street','people in market','people traveling','people waiting','people celebrating','people dancing','people reading','people writing','people sitting','people looking out window','solitary person','farewell people','reunion people','love couple','family gathering','historical people','vintage people','vintage postcard people','old photograph people','daily life photograph','street life people','domestic scene people','human relationship','human connection','people by the sea','people in nature','painting people','painting couple','painting family','painting portrait','painting daily life','artwork people','artwork human figure','postcard people','historical postcard people'];
const positive=['people','person','human','man','woman','child','family','couple','portrait','face','crowd','worker','mother','father','parent','lover','bride','groom','baby','elderly','friend','friends','conversation','meeting','daily life','street','home','relationship','painting','postcard','historical','vintage'];
const negative=['insect','spider','butterfly','bee','motorcycle','motorbike','car','truck','airplane','aircraft','diagram','graph','chart','formula','circuit','machine','engine'];
let seen=new Set(JSON.parse(localStorage.getItem('hestia_seen')||'[]'));
function score(x){const s=((x.title||'')+' '+(x.description||'')+' '+(x.tags||[]).map(t=>t.name||t).join(' ')).toLowerCase();let n=0;for(const w of positive)if(s.includes(w))n+=2;for(const w of negative)if(s.includes(w))n-=3;if(x.height&&x.width){const r=x.width/x.height;if(r>0.35&&r<2.6)n+=1}return n}
function saveSeen(){localStorage.setItem('hestia_seen',JSON.stringify([...seen].slice(-3000)))}
async function getBatch(){const picked=queries[Math.floor(Math.random()*queries.length)];const page=1+Math.floor(Math.random()*8);const u=new URL(API);u.searchParams.set('q',picked);u.searchParams.set('page',page);u.searchParams.set('page_size','30');u.searchParams.set('mature','false');const r=await fetch(u);if(!r.ok)throw new Error('API '+r.status);const d=await r.json();return (d.results||[]).filter(x=>x&&x.url&&x.identifier&&!seen.has(x.identifier)).sort((a,b)=>score(b)-score(a));}
async function draw(){const b=document.getElementById('draw'),a=document.getElementById('again'),st=document.getElementById('status'),wrap=document.getElementById('imageWrap'),meta=document.getElementById('meta');b.disabled=a.disabled=true;st.textContent='Finding an image…';meta.innerHTML='';try{let candidates=[];for(let i=0;i<7&&candidates.length<12;i++){try{candidates.push(...await getBatch())}catch(e){}}candidates=candidates.filter((x,i,self)=>self.findIndex(y=>y.identifier===x.identifier)===i);if(!candidates.length){ throw new Error('No image found right now. Try again.'); }const top=candidates.slice(0,Math.min(18,candidates.length));const x=top[Math.floor(Math.random()*top.length)];seen.add(x.identifier);saveSeen();const img=new Image();img.alt=x.title||'Random oracle image';img.onload=()=>{wrap.innerHTML='';wrap.appendChild(img);};img.onerror=()=>{wrap.innerHTML='<div class="placeholder">This image could not be loaded.<br>Please draw again.</div>'};img.src=x.url;const lic=x.license||'License information not provided';const creator=x.creator||'Creator not listed';const src=x.source_name||x.provider||'Openverse source';const sourceUrl=x.foreign_landing_url||x.source||'';meta.innerHTML='<strong>'+escapeHtml(x.title||'Untitled')+'</strong><br>Creator: '+escapeHtml(creator)+'<br>License: '+escapeHtml(lic)+(x.license_version?' '+escapeHtml(x.license_version):'')+'<br>Source: '+escapeHtml(src)+(sourceUrl?' · <a target="_blank" rel="noopener" href="'+escapeAttr(sourceUrl)+'">open original</a>':'');st.textContent='Image drawn. Let the card and image speak together.';a.disabled=false}catch(e){st.textContent=e.message||'Something went wrong. Please try again.';a.disabled=false}finally{b.disabled=false}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
document.getElementById('draw').onclick=draw;document.getElementById('again').onclick=draw;
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
