<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hestia Image Oracle</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #120d18;
  color: #f5edf8;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 92%;
  max-width: 720px;
  text-align: center;
}

.moon {
  font-size: 28px;
  margin-bottom: 8px;
}

.brand {
  font-size: 13px;
  letter-spacing: 0.25em;
  color: #bca9c6;
}

h1 {
  font-size: 28px;
  font-weight: normal;
  margin: 8px 0 24px;
}

.image-box {
  width: 100%;
  min-height: 55vh;
  background: #21152b;
  border: 1px solid #46344f;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-box img {
  display: block;
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
}

.placeholder {
  color: #bca9c6;
  font-size: 18px;
  line-height: 1.7;
  padding: 40px;
}

button {
  margin-top: 20px;
  padding: 14px 28px;
  border: 1px solid #80618c;
  border-radius: 30px;
  background: #382442;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.source {
  margin-top: 12px;
  font-family: system-ui, sans-serif;
  font-size: 11px;
  color: #8f7c98;
}

.source a {
  color: #cdb1d8;
}
</style>
</head>

<body>

<div class="container">

  <div class="moon">☾</div>

  <div class="brand">
    HESTIA
  </div>

  <h1>
    Image Oracle
  </h1>

  <div class="image-box" id="imageBox">

    <div class="placeholder">
      Your image will appear here.<br>
      Draw when you are ready.
    </div>

  </div>

  <button onclick="drawImage()">
    DRAW AN IMAGE
  </button>

  <div class="source" id="source"></div>

</div>


<script>

const images = [

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Family_portrait.jpg",
    source: "Wikimedia Commons"
  },

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/People_engaging_in_conversation.jpg",
    source: "Wikimedia Commons"
  },

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Photo_of_children_playing.jpg",
    source: "Wikimedia Commons"
  },

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Family_of_three_persons.jpg",
    source: "Wikimedia Commons"
  },

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Children_Playing.jpg",
    source: "Wikimedia Commons"
  },

  {
    url: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Kids_Playing_.jpg",
    source: "Wikimedia Commons"
  }

];


function drawImage() {

  const randomIndex =
    Math.floor(
      Math.random() * images.length
    );

  const selected =
    images[randomIndex];

  const image =
    document.createElement("img");

  image.src =
    selected.url;

  image.alt =
    "Random human life image";

  image.onload = function() {

    const box =
      document.getElementById("imageBox");

    box.innerHTML = "";

    box.appendChild(image);

    document.getElementById("source").innerHTML =
      'Source: <a href="' +
      selected.url +
      '" target="_blank" rel="noopener">' +
      selected.source +
      '</a>';

  };


  image.onerror = function() {

    const box =
      document.getElementById("imageBox");

    box.innerHTML =
      '<div class="placeholder">' +
      'This image could not be loaded.<br>' +
      'Please draw again.' +
      '</div>';

  };

}

</script>

</body>
</html>
